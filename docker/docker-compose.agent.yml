version: '3.8'

services:
  agent-alice:
    build:
      context: ..
      dockerfile: docker/agent-runtime.Dockerfile
    container_name: aegis-agent-alice
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=500M
    mem_limit: 2g
    cpus: "1.0"
    ports:
      - "3000:3000"
    volumes:
      - ../experimental/alice:/workspace:rw
    environment:
      - AEGIS_AGENT_NAME=alice
      - PORT=3000
      - DATABASE_URL=postgresql://localhost:5432/aegis_test_alice
    restart: unless-stopped

  agent-bob:
    build:
      context: ..
      dockerfile: docker/agent-runtime.Dockerfile
    container_name: aegis-agent-bob
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=500M
    mem_limit: 2g
    cpus: "1.0"
    ports:
      - "3100:3100"
    volumes:
      - ../experimental/bob:/workspace:rw
    environment:
      - AEGIS_AGENT_NAME=bob
      - PORT=3100
      - DATABASE_URL=postgresql://localhost:5432/aegis_test_bob
    restart: unless-stopped
