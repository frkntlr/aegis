name: Aegis CI / CD Engine Verification

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions:
  contents: read

jobs:
  verify:
    name: Monorepo Verification (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22, 24]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Monorepo Build (TypeScript)
        run: npm run build

      - name: Monorepo Typecheck
        run: npm run typecheck

      - name: Monorepo Lint
        run: npm run lint

      - name: Deterministic Demir Kafes (Iron Cage) Audit
        run: node packages/cli/dist/bin/aegis.js cage:check

      - name: Iron Cage Verification
        run: node packages/cli/dist/bin/aegis.js verify

      - name: Monorepo Unit Test Suite (All Workspaces)
        run: npm run test --workspaces

      - name: Zero-Token UI Layout Inspection
        run: node packages/cli/dist/bin/aegis.js inspect

      - name: Mutation Testing Gate
        run: node packages/cli/dist/bin/aegis.js mutate
