name: Aegis Release & Package Distribution

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    name: Build & Package Artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: 'https://registry.npmjs.org'

      - name: Install Dependencies
        run: npm ci

      - name: Build Monorepo
        run: npm run build

      - name: Run Test Verification
        run: npm run test --workspaces

      - name: Publish Aegis CLI to npm
        run: |
          if [ -n "$NODE_AUTH_TOKEN" ]; then
            npm publish --workspace=@aegis/cli --access public
          else
            echo "NODE_AUTH_TOKEN is not set, running in dry-run mode..."
            npm publish --workspace=@aegis/cli --access public --dry-run
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: gh release create "${{ github.ref_name }}" --generate-notes --title "Release ${{ github.ref_name }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
