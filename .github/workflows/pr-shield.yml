name: "Aegis Community PR Shield & Iron Cage Gate"

on:
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  pr-review-gate:
    name: "PR Gate: Iron Cage, Immutable Oracle & Unit Tests"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "Checkout Pull Request Code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: "Setup Node.js 24"
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: "Install Monorepo Dependencies"
        run: npm ci

      - name: "Monorepo Build (TypeScript)"
        run: npm run build

      - name: "Monorepo Typecheck"
        run: npm run typecheck

      - name: "Monorepo Lint"
        run: npm run lint

      - name: "Deterministic Demir Kafes (Iron Cage) Audit"
        run: node packages/cli/dist/bin/aegis.js cage:check

      - name: "Iron Cage Verification"
        run: node packages/cli/dist/bin/aegis.js verify

      - name: "Monorepo Unit Test Suite (Turbo Parallel & Cached)"
        run: npm test

      - name: "Zero-Token UI Layout Inspection"
        run: node packages/cli/dist/bin/aegis.js inspect

      - name: "Mutation Testing Gate"
        run: node packages/cli/dist/bin/aegis.js mutate
